# Where does defection stop paying?
#
# UNRUN. The numbers this produces belong in FINDINGS.md once somebody has spent
# the calls; nothing here claims a result yet.

[study]
name    = "trust-game"
judge   = "trust_game:reader"
arena   = "trust_game:arena"
journal = "trust-game.jsonl"
cases   = "trust_game:cases"

# Arms are CONFIGS: the same disposition facing two payoff regimes. That only
# works because the payoffs reach the agent's prompt — until 2026-09-02 they did
# not, so `temptation` moved the scoring arithmetic and nothing else, and this
# study was a null control wearing a question's clothes.
[cases]
probes = "trust_game:probes"
draws  = 6    # five situations x six draws; variety comes from the
              # situations, because this population repeats itself
out    = "trust-game-cases.jsonl"

[cases.arms.safe]
genome = "Play to get the best outcome you can."
config = { temptation = 1.5 }

[cases.arms.tempted]
genome = "Play to get the best outcome you can."
config = { temptation = 8.0 }

[endpoint]
model      = "primary"
max_tokens = 900   # 60 truncated EVERY reply and 400 truncated 17 of 24. This
                   # model reasons at length before a one-word move, and a move
                   # cut mid-sentence is neither a cooperation nor a defection.
                   # The prompt is deliberately NOT told to be brief: reading a
                   # move out of real reasoning text is what this judge is for,
                   # and it is where a negation ("I choose not to defect") would
                   # catch it out.
workers    = 2    # a wall-clock setting; the calls made are identical at any value

[config]
reward = 3.0
sucker = 0.0
punishment = 1.0

[sweep]
# The payoff for defecting on a cooperator. Below `reward` there is no dilemma
# at all; far above it, defection dominates. The boundary is the interesting part.
coordinate  = "temptation"
lo          = 1.0
hi          = 8.0
outcome     = "trust_game:cooperation_rate"
name        = "cooperation rate"
threshold   = 0.5
replicates  = 3
budget_runs = 24
