# The suite needs no model and no network: the live checks skip themselves when
# there is no endpoint, which is the honest state for a CI runner rather than a
# reason to pretend they ran.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # -W error::RuntimeWarning would fail the suite on its own demonstration
      # of an arena that cannot separate draws, so the warning is asserted where
      # it belongs (tests/test_draws.py) rather than globally.
      - run: pytest -q --durations=5
