[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "separatrix"
version = "0.0.1"
description = "Find where a multi-agent outcome flips, with an instrument you have checked."
readme = "README.md"
requires-python = ">=3.11"   # tomllib
license = { file = "LICENSE" }
# Core has NO runtime dependencies, and that is a design rule rather than an
# accident: adapters for other frameworks are extras and convert at the boundary.
dependencies = []

[project.scripts]
sep = "separatrix.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Adapters are extras. Core stays dependency-free; this converts at the boundary.
mesa = ["mesa>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/separatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
